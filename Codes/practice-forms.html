<main id="main">
<h1 style="text-align:center">ABC Hotel Reservation</h1>
<p>Hotel reservation form exercise.</p>
<form action="form-result.html" method="get">
<div class="form-columns">
<fieldset>
<legend>Guest information</legend>
<label for="first">First name (required)</label>
<input id="first" type="text" required >
<label for="last">Last name (required)</label>
<input id="last" type="text" required >
<label for="address1">Address 1</label>
<input id="address1" type="text"  >
<label for="address2">Address 2</label>
<input id="address2" type="text"  >
<label for="city">City</label>
<input id="city" type="text"  >
<label for="state">State / parish</label>
<input id="state" type="text"  >
<label for="zip">Postal code</label>
<input id="zip" type="text"  >
<label for="phone">Phone</label>
<input id="phone" type="tel"  >
<label for="email">Email (required)</label>
<input id="email" type="email" required >
</fieldset>
<fieldset>
<legend>Room information</legend>
<label for="adults">Number of adult guests (required)</label>
<input id="adults" type="number" required min="1" value="1">
<label for="children">Number of child guests</label>
<input id="children" type="number"  min="0" value="0">
<label for="room">Room type</label>
<select id="room">
<option>Standard</option>
<option>Double</option>
<option>Suite</option>
</select>
<label for="arrival">Check-in date (required)</label>
<input id="arrival" type="date" required >
<label for="arrival-time">Check-in time</label>
<input id="arrival-time" type="time"  >
<label for="departure">Check-out date (required)</label>
<input id="departure" type="date" required >
<label for="departure-time">Check-out time</label>
<input id="departure-time" type="time"  >
<label for="instructions">Special instruction</label>
<textarea id="instructions" rows="4">
</textarea>
</fieldset>
</div>
<button type="submit">Submit reservation form</button>
<button type="reset">Reset</button>
</form>
<p>

</p>
