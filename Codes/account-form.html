<h1>Login and registration</h1>
<div class="form-columns">
<form action="form-result.html" method="get">
<fieldset>
<legend>Login</legend>
<label for="login-user">Username or email address (required)</label>
<input id="login-user" type="text" required >
<label for="login-password">Password (required)</label>
<input id="login-password" type="password" required autocomplete="current-password">
<p>
<button type="submit">Login</button>
</p>
<label>
<input type="checkbox"> Remember me</label>
<p>
<a href="contact-form.html">Lost your password?</a>
</p>
</fieldset>
</form>
<form action="form-result.html" method="get">
<fieldset>
<legend>Register</legend>
<label for="register-phone">Phone</label>
<input id="register-phone" type="tel"  >
<label for="register-first">First name (required)</label>
<input id="register-first" type="text" required >
<label for="register-last">Last name (required)</label>
<input id="register-last" type="text" required >
<label for="register-email">Email address (required)</label>
<input id="register-email" type="email" required placeholder="name@example.com">
<label for="register-password">Password (required)</label>
<input id="register-password" type="password" required autocomplete="new-password">
<p>
<button type="submit" disabled>Register</button>
</p>
</fieldset>
</form>
</div>
